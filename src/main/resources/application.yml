server:
  port: 8080


spring:

  application:
    name: gateway-service


  data:
    redis:
      host: localhost
      port: 6379


eureka:

  client:

    service-url:
      defaultZone: http://localhost:8761/eureka

    register-with-eureka: true

    fetch-registry: true



management:

  endpoints:

    web:

      exposure:

        include: "*"


  endpoint:

    health:

      show-details: always


  tracing:

    sampling:

      probability: 1.0


  prometheus:

    metrics:

      export:

        enabled: true



security:

  jwt:

    secret: my-super-secret-key-my-super-secret-key



resilience4j:

  circuitbreaker:

    instances:


      clientCircuitBreaker:

        slidingWindowSize: 10

        minimumNumberOfCalls: 5

        failureRateThreshold: 50

        waitDurationInOpenState: 10s

        permittedNumberOfCallsInHalfOpenState: 3


      orderCircuitBreaker:

        slidingWindowSize: 10

        minimumNumberOfCalls: 5

        failureRateThreshold: 50

        waitDurationInOpenState: 10s

        permittedNumberOfCallsInHalfOpenState: 3


      paymentCircuitBreaker:

        slidingWindowSize: 10

        minimumNumberOfCalls: 5

        failureRateThreshold: 50

        waitDurationInOpenState: 10s

        permittedNumberOfCallsInHalfOpenState: 3